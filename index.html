<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Tic-Tac-Toe/style.css">
  <link rel="stylesheet" href="/bootstrap-5.3.7-dist/bootstrap.min.css">
  <title>Tic-Tac-Toe</title>
</head>

<body class="bg-light">
  <div class="container text-center mt-5">
    <h1 class="mb-4">Tic Tac Toe</h1>
    <p id="statusText" class="fs-5">Player X's Turn</p>

    <div id="board" class="d-grid mx-auto" style="width: 300px;">
      <button class="cell btn btn-outline-dark" data-index="0"></button>
      <button class="cell btn btn-outline-dark" data-index="1"></button>
      <button class="cell btn btn-outline-dark" data-index="2"></button>
      <button class="cell btn btn-outline-dark" data-index="3"></button>
      <button class="cell btn btn-outline-dark" data-index="4"></button>
      <button class="cell btn btn-outline-dark" data-index="5"></button>
      <button class="cell btn btn-outline-dark" data-index="6"></button>
      <button class="cell btn btn-outline-dark" data-index="7"></button>
      <button class="cell btn btn-outline-dark" data-index="8"></button>
      
    </div>

    <button id="restartBtn">Restart Game</button>
  </div>

  <!-- JS FILES -->
  <script src="/bootstrap-5.3.7-dist/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
